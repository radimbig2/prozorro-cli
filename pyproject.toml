[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prozorro-cli"
version = "0.1.0"
description = "Small command-line client for public Prozorro tender data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "prozorro-cli contributors" }]
dependencies = []

[project.scripts]
prozorro-cli = "prozorro_cli.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

